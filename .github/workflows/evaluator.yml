name: Evaluator exported from formal/core

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main]

env:
  ISABELLE_VERSION: Isabelle2025-2

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Isabelle distribution
        id: cache-isabelle
        uses: actions/cache@v6
        with:
          path: ~/isabelle/${{ env.ISABELLE_VERSION }}
          key: ${{ env.ISABELLE_VERSION }}-linux-x86_64

      - name: Download Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          archive="${ISABELLE_VERSION}_linux.tar.gz"
          for base in https://isabelle.in.tum.de/dist https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist; do
            if curl -fL --retry 3 -o "/tmp/$archive" "$base/$archive"; then
              break
            fi
          done
          test -s "/tmp/$archive"
          mkdir -p ~/isabelle
          tar -xzf "/tmp/$archive" -C ~/isabelle
          rm "/tmp/$archive"

      - name: Switch off the PDF document for this build
        run: |
          sed -i -E 's/options \[document = pdf, document_output = "output"\]/options [document = false]/' formal/core/ROOT
          grep -q 'options \[document = false\]' formal/core/ROOT

      # The committed Haskell code must be exactly what Isabelle exports from
      # the checked theories.
      - name: Build TRIEL_Core and export the evaluator
        run: ~/isabelle/${ISABELLE_VERSION}/bin/isabelle build -e -v -D formal/core

      # A cloud session cannot run Isabelle and cannot read the artifacts of
      # this job. When the committed code differs from the exported code on a
      # stage branch, the exported file is posted on the commit, gzip-compressed
      # and base64-encoded, in parts of at most 60 000 characters, so that the
      # session can commit it.
      - name: Post the exported code as commit comments when it differs
        if: startsWith(github.ref_name, 'stage')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- evaluator/generated; then exit 0; fi
          gzip -9 -c evaluator/generated/TRIEL.hs | base64 -w0 > "$RUNNER_TEMP/TRIEL.hs.gz.b64"
          split -b 60000 -d "$RUNNER_TEMP/TRIEL.hs.gz.b64" "$RUNNER_TEMP/part."
          n=$(ls "$RUNNER_TEMP"/part.* | wc -l)
          i=0
          for f in "$RUNNER_TEMP"/part.*; do
            i=$((i+1))
            { echo "exported TRIEL.hs (gzip, base64) part $i of $n, sha256 of the file: $(sha256sum evaluator/generated/TRIEL.hs | cut -c1-64)"; echo; cat "$f"; } > "$RUNNER_TEMP/body.txt"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/body.txt" > /dev/null
          done

      - name: The committed code is the exported code
        run: git diff --exit-code -- evaluator/generated

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      - name: Compile the evaluator
        run: ghc -O1 -ievaluator/generated -outputdir evaluator/build -o evaluator/triel-eval evaluator/Main.hs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the translator's dependencies
        run: pip install lark==1.3.1 pytest

      - name: Classification of every example
        run: |
          python3 parser/triel_to_core.py --classify examples > /tmp/classification.txt
          diff -u examples/core/classification.expected /tmp/classification.txt

      - name: Scenarios against the hand-written expected outputs
        run: |
          status=0
          for scn in examples/core/scenarios/*.scn; do
            python3 parser/triel_eval.py "$scn" > /tmp/out.txt || status=1
            diff -u "${scn%.scn}.expected" /tmp/out.txt || status=1
          done
          exit $status

      - name: Tests of the translator and the driver
        run: python3 -m pytest -q parser/test_triel_to_core.py
