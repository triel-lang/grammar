name: Evaluator exported from formal/core

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main]

env:
  ISABELLE_VERSION: Isabelle2025-2
  # A test that needs the evaluator fails, instead of being skipped, when the
  # evaluator is not built.
  TRIEL_REQUIRE_EVALUATOR: "1"

permissions:
  contents: read

jobs:
  # Isabelle checks the theories and exports the evaluator; the committed code
  # is the exported code; GHC builds the evaluator once. The check jobs below
  # run on this binary, which they check by its sha256.
  build-evaluator:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      eval_sha256: ${{ steps.eval_sha256.outputs.eval_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache the Isabelle distribution
        id: cache-isabelle
        uses: actions/cache@v6
        with:
          path: ~/isabelle/${{ env.ISABELLE_VERSION }}
          key: ${{ env.ISABELLE_VERSION }}-linux-x86_64

      - name: Download Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          archive="${ISABELLE_VERSION}_linux.tar.gz"
          for base in https://isabelle.in.tum.de/dist https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist; do
            if curl -fL --retry 3 -o "/tmp/$archive" "$base/$archive"; then
              break
            fi
          done
          test -s "/tmp/$archive"
          mkdir -p ~/isabelle
          tar -xzf "/tmp/$archive" -C ~/isabelle
          rm "/tmp/$archive"

      - name: Switch off the PDF document for this build
        run: |
          sed -i -E 's/options \[document = pdf, document_output = "output"\]/options [document = false]/' formal/core/ROOT
          grep -q 'options \[document = false\]' formal/core/ROOT

      # The exported code is removed before the export, so that an export that
      # writes nothing leaves no committed file in place: the check of the
      # exported code below then sees the file deleted.
      - name: Remove the exported code before the export
        run: |
          rm -f evaluator/generated/*.hs
          left=$(find evaluator/generated -name '*.hs')
          if [ -n "$left" ]; then
            echo "$left"
            echo "error: evaluator/generated still holds .hs files"
            exit 1
          fi

      # The committed Haskell code must be exactly what Isabelle exports from
      # the checked theories.
      - name: Build TRIEL_Core and export the evaluator
        run: ~/isabelle/${ISABELLE_VERSION}/bin/isabelle build -e -v -D formal/core

      # A cloud session cannot run Isabelle and cannot read the artifacts of
      # this job. When the committed code differs from the exported code on a
      # stage branch, or the export wrote a file that is not committed, the
      # exported file is posted on the commit, gzip-compressed and
      # base64-encoded, in parts of at most 60 000 characters, so that the
      # session can commit it. An export that wrote no TRIEL.hs posts nothing;
      # the check of the exported code below fails on it.
      - name: Post the exported code as commit comments when it differs
        if: startsWith(github.ref_name, 'stage')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- evaluator/generated && [ -z "$(git status --porcelain --untracked-files=all -- evaluator/generated)" ]; then exit 0; fi
          if [ ! -f evaluator/generated/TRIEL.hs ]; then echo "the export wrote no TRIEL.hs: nothing to post"; exit 0; fi
          gzip -9 -c evaluator/generated/TRIEL.hs | base64 -w0 > "$RUNNER_TEMP/TRIEL.hs.gz.b64"
          split -b 60000 -d "$RUNNER_TEMP/TRIEL.hs.gz.b64" "$RUNNER_TEMP/part."
          n=$(ls "$RUNNER_TEMP"/part.* | wc -l)
          i=0
          for f in "$RUNNER_TEMP"/part.*; do
            i=$((i+1))
            { echo "exported TRIEL.hs (gzip, base64) part $i of $n, sha256 of the file: $(sha256sum evaluator/generated/TRIEL.hs | cut -c1-64)"; echo; cat "$f"; } > "$RUNNER_TEMP/body.txt"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/body.txt" > /dev/null
          done

      # Every file of evaluator/generated is committed: the export wrote no
      # file that is not in the commit, ignored files included (the patterns
      # triel-eval and build/ of evaluator/.gitignore also match in
      # evaluator/generated).
      - name: The committed code is the exported code
        run: |
          git diff --exit-code -- evaluator/generated
          status=$(git status --porcelain --untracked-files=all --ignored -- evaluator/generated)
          if [ -n "$status" ]; then
            echo "$status"
            echo "error: evaluator/generated holds files that are not committed"
            exit 1
          fi

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"

      - name: Compile the evaluator
        run: ghc -O1 -ievaluator/generated -outputdir evaluator/build -o evaluator/triel-eval evaluator/Main.hs

      - name: The sha256 of the evaluator
        id: eval_sha256
        run: |
          sha256sum evaluator/triel-eval
          sum=$(sha256sum evaluator/triel-eval)
          echo "eval_sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: triel-eval
          path: evaluator/triel-eval
          if-no-files-found: error
          retention-days: 1

  # hosts/claude-code/test_gate.py, the longest of the checks, in a job of its own.
  check-adapter:
    runs-on: ubuntu-24.04
    needs: build-evaluator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: triel-eval
          path: evaluator

      # The evaluator is the binary that build-evaluator built.
      - name: The evaluator is the one of build-evaluator
        run: |
          chmod +x evaluator/triel-eval
          echo "${{ needs.build-evaluator.outputs.eval_sha256 }}  evaluator/triel-eval" | sha256sum -c -

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the translator's dependencies
        run: pip install lark==1.3.1 pytest

      # hosts/claude-code: the hooks for Claude Code, each run as Claude Code
      # runs a hook, with the clock as an argument.
      - name: Tests of the adapter for Claude Code
        run: python3 -m pytest -q hosts/claude-code/test_gate.py

  # parser/test_triel_to_core.py in a job of its own.
  check-translator:
    runs-on: ubuntu-24.04
    needs: build-evaluator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: triel-eval
          path: evaluator

      # The evaluator is the binary that build-evaluator built.
      - name: The evaluator is the one of build-evaluator
        run: |
          chmod +x evaluator/triel-eval
          echo "${{ needs.build-evaluator.outputs.eval_sha256 }}  evaluator/triel-eval" | sha256sum -c -

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the translator's dependencies
        run: pip install lark==1.3.1 pytest

      - name: Tests of the translator and the driver
        run: python3 -m pytest -q parser/test_triel_to_core.py

  # The classification of the examples, the conformance suite, its manifest and
  # the self-check of run.py, and the tests of the trace of a host.
  check-conformance:
    runs-on: ubuntu-24.04
    needs: build-evaluator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: triel-eval
          path: evaluator

      # The evaluator is the binary that build-evaluator built.
      - name: The evaluator is the one of build-evaluator
        run: |
          chmod +x evaluator/triel-eval
          echo "${{ needs.build-evaluator.outputs.eval_sha256 }}  evaluator/triel-eval" | sha256sum -c -

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the translator's dependencies
        run: pip install lark==1.3.1 pytest

      - name: Classification of every example
        run: |
          python3 parser/triel_to_core.py --classify examples > /tmp/classification.txt
          diff -u examples/core/classification.expected /tmp/classification.txt

      # The conformance suite (examples/core/conformance) with the reference
      # implementation, on both levels.
      - name: Conformance suite with the reference implementation
        run: |
          python3 examples/core/conformance/run.py --level verdicts
          python3 examples/core/conformance/run.py --level monitor

      # manifest.json names the committed evaluator, every scenario, and the
      # sha256 of every file it lists; every level names lines, each with a
      # word (an entry without a word would match every line), and every
      # expected output has a line of every level.
      - name: The manifest of the conformance suite matches the files
        shell: python3 {0}
        run: |
          import hashlib, json, re, sys
          from pathlib import Path
          m = json.loads(Path("examples/core/conformance/manifest.json").read_text(encoding="utf-8"))
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          errors = []
          if m["evaluator_sha256"] != sha("evaluator/generated/TRIEL.hs"):
              errors.append("evaluator_sha256 is not the sha256 of evaluator/generated/TRIEL.hs")
          # A line belongs to a level if its first word, or for TIME ORDER its
          # first two words, is one of the lines of the level, as in run.py.
          levels = {name: [p.split() for p in level["lines"]] for name, level in m["levels"].items()}
          for name, prefixes in levels.items():
              if not prefixes or not all(prefixes):
                  errors.append("levels.%s.lines is empty or holds an entry without a word" % name)
          traces = sorted(c["trace"] for c in m["cases"])
          files = sorted(p.as_posix() for p in Path("examples/core/scenarios").glob("*.scn"))
          if traces != files:
              errors.append("cases differ from the scenarios: only in manifest %s, only on disk %s"
                            % (sorted(set(traces) - set(files)), sorted(set(files) - set(traces))))
          for c in m["cases"]:
              if Path(c["trace"]).stem != c["id"] or c["expected"] != c["trace"][:-len(".scn")] + ".expected":
                  errors.append("%s: id, trace and expected do not agree" % c["id"])
              if not Path(c["trace"]).is_file():
                  errors.append("%s: trace is not a file: %s" % (c["id"], c["trace"]))
                  continue
              if re.findall(r'\(spec "([^"]*)"\)', Path(c["trace"]).read_text(encoding="utf-8")) != [c["spec"]]:
                  errors.append("%s: spec is not the specification of the scenario" % c["id"])
              for k in ("trace", "spec", "expected"):
                  if not Path(c[k]).is_file() or c["sha256"][k] != sha(c[k]):
                      errors.append("%s: sha256 of %s differs from %s" % (c["id"], k, c[k]))
              if Path(c["expected"]).is_file():
                  lines = Path(c["expected"]).read_bytes().decode("utf-8", errors="replace").replace("\r\n", "\n").split("\n")
                  for name, prefixes in levels.items():
                      if prefixes and not any(l.split()[:len(p)] == p for l in lines for p in prefixes):
                          errors.append("%s: %s has no line of the level %s" % (c["id"], c["expected"], name))
          print("\n".join(errors) or "manifest.json: %d cases, every sha256 matches" % len(m["cases"]))
          sys.exit(1 if errors else 0)

      # run.py itself: a command that prints the expected outputs passes on both
      # levels; a command that prints nothing fails on both levels; a command
      # that prints the expected outputs without the MONITOR lines passes on
      # the level verdicts and fails on the level monitor.
      - name: Self-check of the conformance runner
        run: |
          for level in verdicts monitor; do
            python3 examples/core/conformance/run.py --level $level --impl "sh -c 'cat \"\${0%.scn}.expected\"' {trace}" > /tmp/self.txt
          done
          for level in verdicts monitor; do
            if python3 examples/core/conformance/run.py --level $level --impl true > /tmp/self.txt; then
              echo "run.py passed a command without output on the level $level"; exit 1
            fi
          done
          echo "self-check: the command without the MONITOR lines on the level verdicts:"
          python3 examples/core/conformance/run.py --level verdicts --impl "sh -c 'grep -v \"^MONITOR \" \"\${0%.scn}.expected\"' {trace}" > /tmp/self.txt
          if python3 examples/core/conformance/run.py --level monitor --impl "sh -c 'grep -v \"^MONITOR \" \"\${0%.scn}.expected\"' {trace}" > /tmp/self.txt; then
            echo "run.py passed a command without the MONITOR lines on the level monitor"; exit 1
          fi
          tail -n 1 /tmp/self.txt

      - name: test_ci61 G1
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g1

      - name: test_ci61 G2
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g2

      - name: test_ci61 G3
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g3

      - name: test_ci61 G4
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g4

      - name: test_ci61 G1 run.sh
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g1run

      - name: test_ci61 G4 run.sh
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh g4run

      - name: test_ci61 steps
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh steps

      - name: test_ci61 jobs
        if: ${{ !cancelled() }}
        run: tools/test_ci61.sh jobs

      # parser/triel_host.py, the trace that a host builds from its own records,
      # and triel_to_core.py --actions, against the reports of triel check.
      - name: Tests of the trace of a host and of --actions
        run: python3 -m pytest -q parser/test_host.py

  # Every scenario against its expected output, the corpus of the translation,
  # triel check, and the skill for AI agents with AGENTS.md.
  check-scenarios:
    runs-on: ubuntu-24.04
    needs: build-evaluator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: triel-eval
          path: evaluator

      # The evaluator is the binary that build-evaluator built.
      - name: The evaluator is the one of build-evaluator
        run: |
          chmod +x evaluator/triel-eval
          echo "${{ needs.build-evaluator.outputs.eval_sha256 }}  evaluator/triel-eval" | sha256sum -c -

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the translator's dependencies
        run: pip install lark==1.3.1 pytest

      - name: Scenarios against the hand-written expected outputs
        run: |
          status=0
          for scn in examples/core/scenarios/*.scn; do
            python3 parser/triel_eval.py "$scn" > /tmp/out.txt || status=1
            diff -u "${scn%.scn}.expected" /tmp/out.txt || status=1
          done
          exit $status

      # parser/corpus: every case of the corpus against the translator, the
      # format of the corpus, the rules of the grammar it covers, a pair of cases
      # for every reason of rejection, and the table of classes of the reasons.
      - name: Corpus of the translation
        run: python3 -m pytest -q parser/test_corpus.py

      # triel check on every scenario: the text report is the .expected file,
      # the JSON report converts back to it, the scenario in JSON gives the same
      # report, --last, and the exit codes.
      - name: Tests of triel check
        run: python3 -m pytest -q parser/test_triel_check.py

      # .agents/skills/triel/SKILL.md and AGENTS.md: every command, exit code,
      # path, section and TRIEL excerpt they state, and every pitfall, by a run.
      - name: Tests of the skill for AI agents and of AGENTS.md
        run: python3 -m pytest -q parser/test_skill.py

  # The result of the workflow: it fails unless every job above succeeded; a
  # job that failed, was cancelled or was skipped fails it.
  evaluate:
    runs-on: ubuntu-24.04
    needs: [build-evaluator, check-adapter, check-translator, check-conformance, check-scenarios]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          status=0
          echo "build-evaluator: ${{ needs.build-evaluator.result }}"
          if [ "${{ needs.build-evaluator.result }}" != success ]; then status=1; fi
          echo "check-adapter: ${{ needs.check-adapter.result }}"
          if [ "${{ needs.check-adapter.result }}" != success ]; then status=1; fi
          echo "check-translator: ${{ needs.check-translator.result }}"
          if [ "${{ needs.check-translator.result }}" != success ]; then status=1; fi
          echo "check-conformance: ${{ needs.check-conformance.result }}"
          if [ "${{ needs.check-conformance.result }}" != success ]; then status=1; fi
          echo "check-scenarios: ${{ needs.check-scenarios.result }}"
          if [ "${{ needs.check-scenarios.result }}" != success ]; then status=1; fi
          exit $status
