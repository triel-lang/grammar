name: Parse examples against grammar

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: this pipeline is the evidence that the grammar is
      # unambiguous, so it must not silently change under us when a new
      # lark release alters Earley or the dynamic lexer.
      - name: Install parser dependencies
        run: pip install lark==1.3.1

      # Every example must parse under the reference grammar.
      # Audit finding A-01.
      - name: Parse every example under parser/triel.lark
        run: |
          python3 parser/triel_parser.py --check-ambiguity \
            examples/*.triel examples/eudi/*.triel examples/semantics/*.triel \
            examples/core/*.triel

      # The examples corpus cannot detect ambiguity: all four examples
      # are unambiguous, so --check-ambiguity above never fires on them.
      # These fragments are chosen to be ambiguous under the pre-fix
      # grammar and must each have exactly one derivation now.
      # Guards D-19, D-20, D-21/D-32, F-1, F-2, F-6.
      # The same script checks the LALR(1) table of the grammar (four
      # shift/reduce conflicts, none of them an ambiguity, and no
      # reduce/reduce conflict) and that Earley and LALR(1) build the
      # same tree. TECHNICAL_REPORT.md §2.12.
      - name: Ambiguity regression tests
        run: python3 parser/test_ambiguity.py

      # Every TRIEL excerpt of the documents, every grammar excerpt of
      # TECHNICAL_REPORT.md and every usage example of the grammar file
      # conforms to the grammar. The excerpts are extracted from the files.
      - name: Excerpts in the documents
        run: python3 parser/test_documents.py
