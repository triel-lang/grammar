name: Artifact image

on:
  push:
    branches: [main, 'stage*']

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The image (Isabelle with its HOL heap, GHC, Python) needs about 11 GB;
      # preinstalled toolchains the build does not use are removed to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the artifact image
        run: docker build -f artifact/Dockerfile -t triel-artifact .

      - name: Image size
        run: docker image ls triel-artifact

      # artifact/run.sh: every check of isabelle.yml and evaluator.yml, the
      # session of the paper theorems, and the summary. The peak of the memory
      # charged to the container is read from memory.peak of its cgroup (cgroup
      # v2, page cache included) every 2 s while it runs; the value only grows,
      # and the peak is in the clean Isabelle build, long before the end.
      - name: Run the artifact
        run: |
          mkdir -p results
          chmod 777 results
          id=$(docker run -d -e RESULTS_DIR=/results -v "$PWD/results:/results" triel-artifact)
          peak=
          for f in "/sys/fs/cgroup/system.slice/docker-$id.scope/memory.peak" "/sys/fs/cgroup/docker/$id/memory.peak"; do
            [ -r "$f" ] && peak=$f && break
          done
          sampler=
          if [ -n "$peak" ]; then
            ( while v=$(cat "$peak" 2>/dev/null); do echo "$v" > memory-peak.tmp && mv memory-peak.tmp memory-peak.bytes; sleep 2; done ) &
            sampler=$!
          fi
          docker logs -f "$id"
          status=$(docker wait "$id")
          [ -z "$sampler" ] || kill "$sampler" 2>/dev/null || true
          docker rm "$id" > /dev/null
          if [ -s memory-peak.bytes ]; then
            awk '{printf "memory peak of the container: %.2f GiB (%.0f bytes, cgroup memory.peak)\n", $1/1073741824, $1}' memory-peak.bytes | tee results/memory-peak.txt
          else
            echo "memory peak of the container: not measured (no memory.peak found)" | tee results/memory-peak.txt
          fi
          exit "$status"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-results
          path: results/

  # The anonymous source archive of this commit for double-blind review,
  # written by artifact/anonymize.sh and searched by artifact/check_anonymous.sh.
  # It is kept as an artifact of the run, never committed. The full history is
  # fetched: the script checks that no commit hash of the repository is left in
  # the archive.
  anonymous-archive:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_REF: HEAD
      ARCHIVE: triel-artifact-anonymous.tar.gz
    # shell: bash runs with -o pipefail, so a failure is not hidden by tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The artifact with the archive holds the archive only; the result of the
      # search names the words searched for, so it is kept apart.
      - name: Write the anonymous archive
        run: |
          mkdir -p anonymous check
          REF=$ARCHIVE_REF artifact/anonymize.sh "anonymous/$ARCHIVE" | tee check/anonymize.txt
          echo "source: $ARCHIVE_REF = $(git rev-parse "$ARCHIVE_REF^{commit}")" | tee -a check/anonymize.txt

      - name: Search the archive
        run: artifact/check_anonymous.sh "anonymous/$ARCHIVE" | tee check/search.txt

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: triel-artifact-anonymous
          path: anonymous/

      - name: Keep the result of the search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-archive-check
          path: check/
