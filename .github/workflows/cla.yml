name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Pull requests opened by the maintainer's account (Dichis, also used by the
    # maintainer's Claude sessions) or by a GitHub App bot are not checked. The exception
    # is keyed on the account that opened the pull request, which GitHub authenticates.
    # It is not keyed on commit author names: for a commit whose email is linked to no
    # GitHub account, the bot sees only the author name, which anyone can set.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'Dichis' &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.user.login != 'Dichis' &&
       github.event.issue.user.type != 'Bot' &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # The action reads pull request metadata only; it never checks out the pull request's code.
      # Signatures are written to signatures/cla.json on the cla-signatures branch.
      # No allowlist: in pull requests it checks, every commit author signs.
      - name: Check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/triel-lang/grammar/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
