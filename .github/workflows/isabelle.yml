name: Isabelle build of formal/core

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main]

env:
  ISABELLE_VERSION: Isabelle2025-2

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The theories may contain no unproved or assumed results, and the
      # session may not switch proof checking off.
      - name: Check for sorry, oops and axiomatization
        run: |
          if grep -nwE 'sorry|oops|axiomatization' formal/core/*.thy; then
            echo "::error::formal/core contains sorry, oops or axiomatization"
            exit 1
          fi
          if grep -nE 'quick_and_dirty|skip_proofs' formal/core/ROOT; then
            echo "::error::formal/core/ROOT switches proof checking off"
            exit 1
          fi

      # Same Isabelle release as the local build; the unpacked distribution
      # (about 1.2 GB compressed) is cached between runs.
      - name: Cache the Isabelle distribution
        id: cache-isabelle
        uses: actions/cache@v6
        with:
          path: ~/isabelle/${{ env.ISABELLE_VERSION }}
          key: ${{ env.ISABELLE_VERSION }}-linux-x86_64

      - name: Download Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          archive="${ISABELLE_VERSION}_linux.tar.gz"
          for base in https://isabelle.in.tum.de/dist https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist; do
            if curl -fL --retry 3 -o "/tmp/$archive" "$base/$archive"; then
              break
            fi
          done
          test -s "/tmp/$archive"
          mkdir -p ~/isabelle
          tar -xzf "/tmp/$archive" -C ~/isabelle
          rm "/tmp/$archive"

      # The PDF document needs LaTeX, which is not installed here. The document
      # options in ROOT take precedence over "-o document=false", so they are
      # switched off in the runner's copy of ROOT only.
      - name: Switch off the PDF document for this build
        run: |
          sed -i -E 's/options \[document = pdf, document_output = "output"\]/options [document = false]/' formal/core/ROOT
          grep -q 'options \[document = false\]' formal/core/ROOT
          cat formal/core/ROOT

      # -b keeps the heap of TRIEL_Core for the session TRIEL_Core_Checks below.
      - name: Build session TRIEL_Core
        shell: bash
        run: |
          set -o pipefail
          ~/isabelle/${ISABELLE_VERSION}/bin/isabelle build -b -v -D formal/core 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"

      # formal/checks/No_Oracles.thy imports exactly the theories of
      # formal/core/ROOT (in any order), so that a new theory of ROOT cannot
      # escape the check for oracles. The theories of ROOT are read as
      # tools/make_afp_copy.sh reads them; the imports only between "imports"
      # and "begin".
      - name: Compare the theories of ROOT with the imports of No_Oracles.thy
        shell: bash
        run: |
          set -o pipefail
          {
            root=$(awk '
              /^[[:space:]]*theories[[:space:]]*$/ { on = 1; next }
              /^[[:space:]]*(document_files|export_files|sessions|options)([[:space:](]|$)/ { on = 0 }
              on && NF { print $1 }' formal/core/ROOT | sort)
            imports=$(awk '
              /^theory[[:space:]]+[A-Za-z0-9_]+[[:space:]]*$/ { header = 1 }
              header && /(^|[[:space:]])imports([[:space:]]|$)/ { on = 1 }
              on && /(^|[[:space:]])begin([[:space:]]|$)/ { exit }
              on { print }' formal/checks/No_Oracles.thy \
              | grep -oE '"?TRIEL_Core\.[A-Za-z0-9_]+' | sed -E 's/^"?TRIEL_Core\.//' | sort)
            [ -n "$root" ] || { echo "error: no theories found in formal/core/ROOT"; exit 1; }
            if diff -u <(echo "$root") <(echo "$imports"); then
              echo "The imports of formal/checks/No_Oracles.thy are the $(echo "$root" | wc -l) theories of formal/core/ROOT"
            else
              echo "error: the theories of formal/core/ROOT (-) and the imports of formal/checks/No_Oracles.thy (+) differ"
              exit 1
            fi
          } 2>&1 | tee "$RUNNER_TEMP/theories.log"

      # The session TRIEL_Core_Checks (formal/checks), on the heap of
      # TRIEL_Core: no named theorem of the theories of ROOT depends on an
      # oracle, except the equations of the Quickcheck generators
      # (full_exhaustive, narrowing) that the datatype package defines itself
      # and whose termination HOL accepts with the oracle Pure.skip_proof; no
      # other theorem depends on them (No_Oracles.thy states the exact rule).
      # The grep above sees only the text of the theories; an oracle brought
      # in by a proof method is seen here. -e writes the number of named facts
      # checked in each theory and the excluded facts to
      # formal/checks/output/no_oracles.txt.
      - name: Check the named theorems of TRIEL_Core for oracles
        shell: bash
        run: |
          set -o pipefail
          ~/isabelle/${ISABELLE_VERSION}/bin/isabelle build -e -v -d formal/core -D formal/checks 2>&1 | tee "$RUNNER_TEMP/no-oracles.log"
          cat formal/checks/output/no_oracles.txt

      # The theories that the check went through, read from no_oracles.txt, are
      # those of ROOT; the total is the sum of the numbers of the theories, and
      # the number of excluded facts is the sum of those of the theories and
      # the number of the facts listed.
      - name: Compare the theories of no_oracles.txt with ROOT
        shell: bash
        run: |
          set -o pipefail
          {
            out=formal/checks/output/no_oracles.txt
            root=$(awk '
              /^[[:space:]]*theories[[:space:]]*$/ { on = 1; next }
              /^[[:space:]]*(document_files|export_files|sessions|options)([[:space:](]|$)/ { on = 0 }
              on && NF { print $1 }' formal/core/ROOT | sort)
            checked=$(sed -nE 's/^TRIEL_Core\.([A-Za-z0-9_]+): [0-9]+ facts$/\1/p' "$out" | sort)
            sum=$(sed -nE 's/^TRIEL_Core\.[A-Za-z0-9_]+: ([0-9]+) facts$/\1/p' "$out" | awk '{ s += $1 } END { print s + 0 }')
            excluded=$(sed -nE 's/^  TRIEL_Core\.([A-Za-z0-9_]+): [0-9]+ excluded$/\1/p' "$out" | sort)
            sum_excluded=$(sed -nE 's/^  TRIEL_Core\.[A-Za-z0-9_]+: ([0-9]+) excluded$/\1/p' "$out" | awk '{ s += $1 } END { print s + 0 }')
            listed=$(grep -cE '^    [A-Za-z0-9_.]+$' "$out" || true)
            line=$(grep -E '^Theorems of TRIEL_Core without oracles: ' "$out" || true)
            total=$(echo "$line" | sed -nE 's/^Theorems of TRIEL_Core without oracles: ([0-9]+) \(excluded: [0-9]+ Quickcheck generator facts with Pure\.skip_proof\)$/\1/p')
            total_excluded=$(echo "$line" | sed -nE 's/^Theorems of TRIEL_Core without oracles: [0-9]+ \(excluded: ([0-9]+) Quickcheck generator facts with Pure\.skip_proof\)$/\1/p')
            [ -n "$root" ] || { echo "error: no theories found in formal/core/ROOT"; exit 1; }
            if ! diff -u <(echo "$root") <(echo "$checked"); then
              echo "error: the theories of formal/core/ROOT (-) and those of $out (+) differ"
              exit 1
            fi
            if ! diff -u <(echo "$root") <(echo "$excluded"); then
              echo "error: the theories of formal/core/ROOT (-) and those of the excluded facts in $out (+) differ"
              exit 1
            fi
            if [ -z "$total" ] || [ "$total" != "$sum" ]; then
              echo "error: the total in $out (${total:-none}) is not the sum of the theories ($sum)"
              exit 1
            fi
            if [ "$total_excluded" != "$sum_excluded" ] || [ "$total_excluded" != "$listed" ]; then
              echo "error: the number of excluded facts in $out (${total_excluded:-none}) is not the sum of the theories ($sum_excluded) or the number listed ($listed)"
              exit 1
            fi
            echo "$out: the $(echo "$checked" | wc -l) theories of formal/core/ROOT; $line"
          } 2>&1 | tee -a "$RUNNER_TEMP/theories.log"

      # The logs of this workflow cannot be read from a cloud session, so on a
      # push to a branch stage* the result of the check is posted as a comment
      # on the commit. Not on main.
      - name: Post the result of the check for oracles as a commit comment
        if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/stage') && hashFiles('formal/checks/output/no_oracles.txt') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Check for oracles of TRIEL_Core (run ${{ github.run_id }}): formal/checks/output/no_oracles.txt"
            echo
            echo '```'
            cat formal/checks/output/no_oracles.txt
            echo '```'
          } > "$RUNNER_TEMP/no-oracles-comment.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$RUNNER_TEMP/no-oracles-comment.md" > /dev/null

      # The logs of this job cannot be read from a cloud session. When a step
      # fails, the error lines of the Isabelle builds and the output of the
      # comparisons of the theories are posted as a comment on the commit, so
      # that they can be read through the API.
      - name: Post the error lines as a commit comment
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          {
            echo "Job build failed (run ${{ github.run_id }})."
            last=
            for log in isabelle-build.log no-oracles.log; do
              test -s "$RUNNER_TEMP/$log" || continue
              last=$log
              grep -q '^\*\*\*' "$RUNNER_TEMP/$log" || continue
              echo
              echo "Error lines of $log:"
              echo
              echo '```'
              grep -n -A12 '^\*\*\*' "$RUNNER_TEMP/$log" | head -c 25000 || true
              echo '```'
              found=1
            done
            if [ -z "${found:-}" ] && [ -n "$last" ]; then
              echo
              echo "No *** lines; the last lines of $last:"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/$last"
              echo '```'
            fi
            if test -s "$RUNNER_TEMP/theories.log"; then
              echo
              echo "Comparison of the theories:"
              echo
              echo '```'
              head -c 8000 "$RUNNER_TEMP/theories.log"
              echo '```'
            fi
          } > "$comment"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$comment" > /dev/null

  # formal/core/build.log: a clean build of all theories of formal/core/ROOT,
  # with the options of ROOT as they are (the PDF document included), in the
  # Docker image of Isabelle2025-2 with LaTeX, pinned by digest. The log holds
  # only the output of the container that runs isabelle build. It checks
  # nothing that the job build does not; it makes the log.
  build-log:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUILD_LOG_IMAGE: makarius/isabelle:Isabelle2025-2_X11_Latex@sha256:7ae4b4e9eb3eea00185f9bffe4fdbff16dc9ec74a88b918f847c41bc475bd297
    steps:
      - uses: actions/checkout@v7

      - name: Pull the image
        id: image
        shell: bash
        run: |
          docker pull "$BUILD_LOG_IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$BUILD_LOG_IMAGE")
          echo "image: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Clean build of TRIEL_Core with the PDF document
        id: build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/build-log" formal/core/output
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" "$BUILD_LOG_IMAGE" \
            build -c -v -D /work/formal/core > "$RUNNER_TEMP/build-log/build.log" 2>&1 \
            || { tail -n 60 "$RUNNER_TEMP/build-log/build.log"; exit 1; }
          cat "$RUNNER_TEMP/build-log/build.log"
          test -s formal/core/output/document.pdf
          cp formal/core/output/document.pdf "$RUNNER_TEMP/build-log/document.pdf"
          sha256sum "$RUNNER_TEMP/build-log/build.log"

      - name: Keep the build log and the document
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: core-build-log
          path: ${{ runner.temp }}/build-log/

      # The logs and artifacts of this workflow cannot be read from a cloud
      # session, so on a push to a branch stage* the digest of the image, the
      # sha256 of the log and the log itself are posted as a comment on the
      # commit; if the build failed, the last 60 lines of the log. Not on main.
      - name: Post the build log as a commit comment
        if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/stage') && steps.build.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          log="$RUNNER_TEMP/build-log/build.log"
          comment="$RUNNER_TEMP/build-log-comment.md"
          {
            echo "Build log of formal/core (run ${{ github.run_id }}, job build-log)"
            echo
            echo "image: \`$DIGEST\`"
            if [ "$OUTCOME" = success ]; then
              echo "sha256 of the log: \`$(sha256sum < "$log" | cut -d' ' -f1)\`"
              echo
              echo '```'
              cat "$log"
              echo '```'
            else
              echo "The build failed ($OUTCOME). Last 60 lines of the log:"
              echo
              echo '```'
              tail -n 60 "$log"
              echo '```'
            fi
          } > "$comment"
          length=$(wc -m < "$comment")
          if [ "$length" -gt 60000 ]; then
            echo "::error::the comment with the build log has $length characters, more than 60000; it is not posted"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$comment" > /dev/null

  # The copy of formal/core for the Archive of Formal Proofs, made by
  # tools/make_afp_copy.sh and built as the AFP builds an entry, with the PDF
  # document, in the Docker image of the Isabelle release that the latest AFP
  # release is for (afp-2026-10-16: Isabelle2025-2). The image with LaTeX is
  # used for the document. Isabelle2026 was released on 2026-10-25 (the date in
  # metadata/release-dates of the AFP repository for Isabelle2026), and the AFP
  # has no release for it yet; the jobs afp-2026 and afp-2026-lint below check
  # the same copy with it.
  afp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp"
          tools/make_afp_copy.sh "$RUNNER_TEMP/afp" 2>&1 | tee "$RUNNER_TEMP/afp/copy.log"

      - name: Build session TRIEL_Core in makarius/isabelle:${{ env.ISABELLE_VERSION }}_X11_Latex
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp/output"
          chmod -R a+rwX "$RUNNER_TEMP/afp"
          docker run --rm -v "$RUNNER_TEMP/afp:/work" "makarius/isabelle:${ISABELLE_VERSION}_X11_Latex" \
            build -v -o browser_info -o document=pdf \
            -o "document_variants=document:outline=/proof,/ML" \
            -o document_output=/work/output -D /work/TRIEL_Core 2>&1 | tee "$RUNNER_TEMP/afp/build.log"

      - name: Keep the copy, the logs and the documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-TRIEL_Core
          path: |
            ${{ runner.temp }}/afp/TRIEL_Core/
            ${{ runner.temp }}/afp/copy.log
            ${{ runner.temp }}/afp/build.log
            ${{ runner.temp }}/afp/output/*.pdf

  # The same copy, built in the same way in the official Docker image of
  # Isabelle2026 with LaTeX, pinned by digest. The copy itself is kept as an
  # archive, with the logs and the documents.
  afp-2026:
    runs-on: ubuntu-24.04
    env:
      ISABELLE_2026_IMAGE: makarius/isabelle:Isabelle2026_X11_Latex@sha256:a45d4bb7726cf2efc72eb7055f923228bdddfd427df87641850e10caae14c78e
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy and its archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp"
          tools/make_afp_copy.sh "$RUNNER_TEMP/afp" 2>&1 | tee "$RUNNER_TEMP/afp/copy.log"
          tar -C "$RUNNER_TEMP/afp" --sort=name --mtime='2000-01-01 00:00:00Z' --owner=0 --group=0 \
            --numeric-owner --mode='u=rwX,go=rX' -cf - TRIEL_Core | gzip -n > "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"
          tar -tzvf "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"
          sha256sum "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"

      - name: Build session TRIEL_Core in Isabelle2026
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp/output"
          chmod -R a+rwX "$RUNNER_TEMP/afp"
          docker run --rm "$ISABELLE_2026_IMAGE" version
          docker run --rm -v "$RUNNER_TEMP/afp:/work" "$ISABELLE_2026_IMAGE" \
            build -v -o browser_info -o document=pdf \
            -o "document_variants=document:outline=/proof,/ML" \
            -o document_output=/work/output -D /work/TRIEL_Core 2>&1 | tee "$RUNNER_TEMP/afp/build.log"

      - name: Keep the archive of the copy, the logs and the documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-2026-TRIEL_Core
          path: |
            ${{ runner.temp }}/afp/TRIEL_Core.tar.gz
            ${{ runner.temp }}/afp/copy.log
            ${{ runner.temp }}/afp/build.log
            ${{ runner.temp }}/afp/output/*.pdf

  # isabelle-linter (github.com/isabelle-prover/isabelle-linter, the release
  # Isabelle2026-v1.0.0, checked against its commit) on the AFP copy, in the
  # same image as afp-2026, with the bundles afp_mandatory (the lints that the
  # AFP requires), default and non_interactive_addon. "-f warn" makes the job
  # fail on any finding, warning or error.
  afp-2026-lint:
    runs-on: ubuntu-24.04
    env:
      ISABELLE_2026_IMAGE: makarius/isabelle:Isabelle2026_X11_Latex@sha256:a45d4bb7726cf2efc72eb7055f923228bdddfd427df87641850e10caae14c78e
      LINTER_TAG: Isabelle2026-v1.0.0
      LINTER_COMMIT: 146d9fc0bbd304dd6f15fdb607331f7d81e92723
      LINT_BUNDLES: afp_mandatory,default,non_interactive_addon
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lint"
          tools/make_afp_copy.sh "$RUNNER_TEMP/lint" 2>&1 | tee "$RUNNER_TEMP/lint/copy.log"

      - name: Get isabelle-linter ${{ env.LINTER_TAG }}
        shell: bash
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$LINTER_TAG" \
            https://github.com/isabelle-prover/isabelle-linter "$RUNNER_TEMP/lint/isabelle-linter"
          test "$(git -C "$RUNNER_TEMP/lint/isabelle-linter" rev-parse HEAD)" = "$LINTER_COMMIT"

      - name: Lint session TRIEL_Core
        shell: bash
        run: |
          chmod -R a+rwX "$RUNNER_TEMP/lint"
          docker run --rm -e LINT_BUNDLES -v "$RUNNER_TEMP/lint:/work" --entrypoint bash "$ISABELLE_2026_IMAGE" -c '
            set -e
            isabelle=Isabelle/bin/isabelle
            $isabelle version
            $isabelle components -u /work/isabelle-linter/linter_base
            $isabelle scala_build
            $isabelle lint -l -o "lint_bundles=$LINT_BUNDLES"
            $isabelle lint -o "lint_bundles=$LINT_BUNDLES" -f warn -d /work/TRIEL_Core TRIEL_Core
          ' 2>&1 | tee "$RUNNER_TEMP/lint/lint.log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-2026-lint
          path: |
            ${{ runner.temp }}/lint/copy.log
            ${{ runner.temp }}/lint/lint.log
