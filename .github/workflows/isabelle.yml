name: Isabelle build of formal/core

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main]

env:
  ISABELLE_VERSION: Isabelle2025-2

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The theories may contain no unproved or assumed results, and the
      # session may not switch proof checking off.
      - name: Check for sorry, oops and axiomatization
        run: |
          if grep -nwE 'sorry|oops|axiomatization' formal/core/*.thy; then
            echo "::error::formal/core contains sorry, oops or axiomatization"
            exit 1
          fi
          if grep -nE 'quick_and_dirty|skip_proofs' formal/core/ROOT; then
            echo "::error::formal/core/ROOT switches proof checking off"
            exit 1
          fi

      # Same Isabelle release as the local build; the unpacked distribution
      # (about 1.2 GB compressed) is cached between runs.
      - name: Cache the Isabelle distribution
        id: cache-isabelle
        uses: actions/cache@v6
        with:
          path: ~/isabelle/${{ env.ISABELLE_VERSION }}
          key: ${{ env.ISABELLE_VERSION }}-linux-x86_64

      - name: Download Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          archive="${ISABELLE_VERSION}_linux.tar.gz"
          for base in https://isabelle.in.tum.de/dist https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist; do
            if curl -fL --retry 3 -o "/tmp/$archive" "$base/$archive"; then
              break
            fi
          done
          test -s "/tmp/$archive"
          mkdir -p ~/isabelle
          tar -xzf "/tmp/$archive" -C ~/isabelle
          rm "/tmp/$archive"

      # The PDF document needs LaTeX, which is not installed here. The document
      # options in ROOT take precedence over "-o document=false", so they are
      # switched off in the runner's copy of ROOT only.
      - name: Switch off the PDF document for this build
        run: |
          sed -i -E 's/options \[document = pdf, document_output = "output"\]/options [document = false]/' formal/core/ROOT
          grep -q 'options \[document = false\]' formal/core/ROOT
          cat formal/core/ROOT

      - name: Build session TRIEL_Core
        shell: bash
        run: |
          set -o pipefail
          ~/isabelle/${ISABELLE_VERSION}/bin/isabelle build -v -D formal/core 2>&1 | tee "$RUNNER_TEMP/isabelle-build.log"

      # The logs of this job cannot be read from a cloud session. When the
      # build fails, the error lines are posted as a comment on the commit, so
      # that they can be read through the API.
      - name: Post the error lines as a commit comment
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/isabelle-build.log"
          test -s "$log" || { echo "no build log"; exit 0; }
          {
            echo "Isabelle build of formal/core failed (run ${{ github.run_id }}). Error lines:"
            echo
            echo '```'
            grep -n -A12 '^\*\*\*' "$log" | head -c 60000 || { echo "(no *** lines; last lines of the log)"; tail -n 40 "$log"; }
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat "$RUNNER_TEMP/comment.md")" > /dev/null

  # The copy of formal/core for the Archive of Formal Proofs, made by
  # tools/make_afp_copy.sh and built as the AFP builds an entry, with the PDF
  # document, in the Docker image of the Isabelle release that the latest AFP
  # release is for (afp-2026-10-16: Isabelle2025-2). The image with LaTeX is
  # used for the document. Isabelle2026 was released on 2026-10-25 (the date in
  # metadata/release-dates of the AFP repository for Isabelle2026), and the AFP
  # has no release for it yet; the jobs afp-2026 and afp-2026-lint below check
  # the same copy with it.
  afp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp"
          tools/make_afp_copy.sh "$RUNNER_TEMP/afp" 2>&1 | tee "$RUNNER_TEMP/afp/copy.log"

      - name: Build session TRIEL_Core in makarius/isabelle:${{ env.ISABELLE_VERSION }}_X11_Latex
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp/output"
          chmod -R a+rwX "$RUNNER_TEMP/afp"
          docker run --rm -v "$RUNNER_TEMP/afp:/work" "makarius/isabelle:${ISABELLE_VERSION}_X11_Latex" \
            build -v -o browser_info -o document=pdf \
            -o "document_variants=document:outline=/proof,/ML" \
            -o document_output=/work/output -D /work/TRIEL_Core 2>&1 | tee "$RUNNER_TEMP/afp/build.log"

      - name: Keep the copy, the logs and the documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-TRIEL_Core
          path: |
            ${{ runner.temp }}/afp/TRIEL_Core/
            ${{ runner.temp }}/afp/copy.log
            ${{ runner.temp }}/afp/build.log
            ${{ runner.temp }}/afp/output/*.pdf

  # The same copy, built in the same way in the official Docker image of
  # Isabelle2026 with LaTeX, pinned by digest. The copy itself is kept as an
  # archive, with the logs and the documents.
  afp-2026:
    runs-on: ubuntu-24.04
    env:
      ISABELLE_2026_IMAGE: makarius/isabelle:Isabelle2026_X11_Latex@sha256:a45d4bb7726cf2efc72eb7055f923228bdddfd427df87641850e10caae14c78e
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy and its archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp"
          tools/make_afp_copy.sh "$RUNNER_TEMP/afp" 2>&1 | tee "$RUNNER_TEMP/afp/copy.log"
          tar -C "$RUNNER_TEMP/afp" --sort=name --mtime='2000-01-01 00:00:00Z' --owner=0 --group=0 \
            --numeric-owner --mode='u=rwX,go=rX' -cf - TRIEL_Core | gzip -n > "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"
          tar -tzvf "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"
          sha256sum "$RUNNER_TEMP/afp/TRIEL_Core.tar.gz"

      - name: Build session TRIEL_Core in Isabelle2026
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/afp/output"
          chmod -R a+rwX "$RUNNER_TEMP/afp"
          docker run --rm "$ISABELLE_2026_IMAGE" version
          docker run --rm -v "$RUNNER_TEMP/afp:/work" "$ISABELLE_2026_IMAGE" \
            build -v -o browser_info -o document=pdf \
            -o "document_variants=document:outline=/proof,/ML" \
            -o document_output=/work/output -D /work/TRIEL_Core 2>&1 | tee "$RUNNER_TEMP/afp/build.log"

      - name: Keep the archive of the copy, the logs and the documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-2026-TRIEL_Core
          path: |
            ${{ runner.temp }}/afp/TRIEL_Core.tar.gz
            ${{ runner.temp }}/afp/copy.log
            ${{ runner.temp }}/afp/build.log
            ${{ runner.temp }}/afp/output/*.pdf

  # isabelle-linter (github.com/isabelle-prover/isabelle-linter, the release
  # Isabelle2026-v1.0.0, checked against its commit) on the AFP copy, in the
  # same image as afp-2026, with the bundles afp_mandatory (the lints that the
  # AFP requires), default and non_interactive_addon. "-f warn" makes the job
  # fail on any finding, warning or error.
  afp-2026-lint:
    runs-on: ubuntu-24.04
    env:
      ISABELLE_2026_IMAGE: makarius/isabelle:Isabelle2026_X11_Latex@sha256:a45d4bb7726cf2efc72eb7055f923228bdddfd427df87641850e10caae14c78e
      LINTER_TAG: Isabelle2026-v1.0.0
      LINTER_COMMIT: 146d9fc0bbd304dd6f15fdb607331f7d81e92723
      LINT_BUNDLES: afp_mandatory,default,non_interactive_addon
    steps:
      - uses: actions/checkout@v7

      - name: Make the AFP copy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lint"
          tools/make_afp_copy.sh "$RUNNER_TEMP/lint" 2>&1 | tee "$RUNNER_TEMP/lint/copy.log"

      - name: Get isabelle-linter ${{ env.LINTER_TAG }}
        shell: bash
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$LINTER_TAG" \
            https://github.com/isabelle-prover/isabelle-linter "$RUNNER_TEMP/lint/isabelle-linter"
          test "$(git -C "$RUNNER_TEMP/lint/isabelle-linter" rev-parse HEAD)" = "$LINTER_COMMIT"

      - name: Lint session TRIEL_Core
        shell: bash
        run: |
          chmod -R a+rwX "$RUNNER_TEMP/lint"
          docker run --rm -e LINT_BUNDLES -v "$RUNNER_TEMP/lint:/work" --entrypoint bash "$ISABELLE_2026_IMAGE" -c '
            set -e
            isabelle=Isabelle/bin/isabelle
            $isabelle version
            $isabelle components -u /work/isabelle-linter/linter_base
            $isabelle scala_build
            $isabelle lint -l -o "lint_bundles=$LINT_BUNDLES"
            $isabelle lint -o "lint_bundles=$LINT_BUNDLES" -f warn -d /work/TRIEL_Core TRIEL_Core
          ' 2>&1 | tee "$RUNNER_TEMP/lint/lint.log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afp-2026-lint
          path: |
            ${{ runner.temp }}/lint/copy.log
            ${{ runner.temp }}/lint/lint.log
